backend:
  name: git-gateway
  branch: main

media_folder: "public/images/clinic"
public_folder: "/images/clinic"

collections:
  - name: "clinic"
    label: "Clinic Settings"
    folder: "src/content/clinic"
    create: false
    slug: "{{slug}}"
    fields:

      # ── Clinic Info ──────────────────────────────────
      - { label: "🏥 Clinic Name", name: "name", widget: "string" }
      - { label: "Short Name (city only)", name: "shortName", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string", default: "Do Health Differently" }
      - { label: "Phone", name: "phone", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }

      # ── Address ──────────────────────────────────────
      - label: "📍 Address"
        name: "address"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Street", name: "street", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "State", name: "state", widget: "string" }
          - { label: "Zip", name: "zip", widget: "string" }
          - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
          - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }

      # ── Hours ─────────────────────────────────────────
      - label: "🕐 Hours"
        name: "hours"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Monday", name: "monday", widget: "string", default: "9:00am – 6:00pm" }
          - { label: "Tuesday", name: "tuesday", widget: "string", default: "9:00am – 6:00pm" }
          - { label: "Wednesday", name: "wednesday", widget: "string", default: "9:00am – 6:00pm" }
          - { label: "Thursday", name: "thursday", widget: "string", default: "9:00am – 6:00pm" }
          - { label: "Friday", name: "friday", widget: "string", default: "9:00am – 4:00pm" }
          - { label: "Saturday", name: "saturday", widget: "string", default: "Closed" }
          - { label: "Sunday", name: "sunday", widget: "string", default: "Closed" }

      # ── Scheduling ────────────────────────────────────
      - label: "📅 Scheduling"
        name: "scheduling"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Type", name: "type", widget: "select", options: ["neo", "ghl", "none"], default: "neo" }
          - { label: "NEO Scheduling URL", name: "neoUrl", widget: "string", required: false }
          - { label: "GoHighLevel Form ID", name: "ghlFormId", widget: "string", required: false }
          - { label: "Button Text", name: "ctaText", widget: "string", default: "Book a New Patient Visit" }

      # ── Hero Section ──────────────────────────────────
      - label: "🖼 Hero Section"
        name: "hero"
        widget: "object"
        collapsed: false
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Subheadline", name: "subhead", widget: "text" }
          - { label: "Button Text", name: "ctaText", widget: "string" }
          - { label: "Background Image", name: "image", widget: "image", required: false }

      # ── About Section ─────────────────────────────────
      - label: "📖 About Section"
        name: "about"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Body Text", name: "body", widget: "text" }
          - { label: "Mission Statement", name: "missionStatement", widget: "string" }
          - { label: "Homepage Photo", name: "image", widget: "image", required: false }
          - { label: "About Page Photo", name: "pageImage", widget: "image", required: false, hint: "If not set, uses Homepage Photo" }

      # ── Team ──────────────────────────────────────────
      - label: "👥 Team Members"
        name: "team"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Photo", name: "photo", widget: "image", required: false }

      # ── Services ──────────────────────────────────────
      - label: "⚕️ Services"
        name: "services"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Icon", name: "icon", widget: "string", required: false }

      # ── Store ─────────────────────────────────────────
      - label: "🛒 Store"
        name: "store"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Show Store Link in Nav", name: "enabled", widget: "boolean", default: false }
          - { label: "Store URL", name: "url", widget: "string", required: false }

      # ── Social Media ──────────────────────────────────
      - label: "📱 Social Media"
        name: "social"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube", widget: "string", required: false }

      # ── SEO ───────────────────────────────────────────
      - label: "🔍 SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Home Page Title", name: "title", widget: "string" }
          - { label: "Home Meta Description", name: "description", widget: "text" }
          - { label: "About Page Title", name: "aboutTitle", widget: "string", required: false }
          - { label: "Services Page Title", name: "servicesTitle", widget: "string", required: false }
          - { label: "Contact Page Title", name: "contactTitle", widget: "string", required: false }

      # ── Tracking ──────────────────────────────────────
      - label: "📊 Tracking"
        name: "tracking"
        widget: "object"
        collapsed: true
        fields:
          - { label: "GA4 Measurement ID", name: "ga4", widget: "string", required: false }
          - { label: "Meta Pixel ID", name: "metaPixel", widget: "string", required: false }
          - { label: "Custom Head Scripts", name: "customHeadScripts", widget: "text", required: false }

      # ── Landing Pages ─────────────────────────────────
      - label: "🚀 Landing Pages"
        name: "campaigns"
        widget: "list"
        collapsed: false
        hint: "Each entry creates a page at /lp/[slug] e.g. /lp/new-patient"
        fields:
          - { label: "URL Slug", name: "slug", widget: "string", hint: "e.g. new-patient or back-pain (no spaces)" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Subheadline", name: "subhead", widget: "text" }
          - { label: "Offer Text", name: "offer", widget: "string", required: false }

